<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title description">
  <title id="title">HAM-VLN：单个 episode 的横向流程</title>
  <desc id="description">从左到右：输入指令并初始化，获取当前观察、确定子目标并检索记忆，System 2 同次输出动作、记忆写入和理由，先更新进度及世界图，再按动作类型分支。Stop 直接结束。Backtrack 提取返回目标之后的轨迹后缀，映射为地点并排除返回目标所属地点，写入失败理由后返回已存锚点。普通前进由 System 1 定位目标再通过控制器执行。两种非停止分支汇合到工作窗口更新，并返回下一个决策 waypoint 的观察与检索。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#39735f"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#203832;text-anchor:middle}
      .title{font-size:27px;font-weight:700}.label{font-size:22px;font-weight:650}.sub{font-size:18px;fill:#5e6e68}.small{font-size:17px;fill:#5e6e68}.edge{font-size:18px;fill:#39735f}
      .box{fill:#f0f6f2;stroke:#9dbdaf;stroke-width:1.6}.reason{fill:#e4efe8;stroke:#39735f;stroke-width:1.8}.line{fill:none;stroke:#39735f;stroke-width:2.2;stroke-linejoin:round;marker-end:url(#arrow)}.join{fill:none;stroke:#39735f;stroke-width:2.2}.return{stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1440" height="640" rx="18" fill="#fff"/>
  <text class="title" x="720" y="39">HAM-VLN · 单个 episode 的完整流程</text>
  <text class="small" x="720" y="69">Algorithm 1 · 从左到右执行，非停止分支在底部汇合并进入下一轮</text>

  <rect class="box" x="20" y="244" width="150" height="104" rx="13"/>
  <text class="label" x="95" y="275">输入与初始化</text>
  <text class="sub" x="95" y="305">指令 → 进度</text>
  <text class="small" x="95" y="332">图与窗口置空</text>
  <path class="line" d="M170 296 H210"/>

  <rect class="box" x="210" y="224" width="220" height="144" rx="13"/>
  <text class="label" x="320" y="258">观察与记忆检索</text>
  <text class="sub" x="320" y="289">RGB-D + 位姿</text>
  <text class="sub" x="320" y="317">确定当前子目标</text>
  <text class="small" x="320" y="346">窗口 + 进度 + 图切片</text>
  <path class="line" d="M430 296 H470"/>

  <rect class="reason" x="470" y="244" width="190" height="104" rx="13"/>
  <text class="label" x="565" y="275">System 2</text>
  <text class="sub" x="565" y="304">同次决策输出</text>
  <text class="small" x="565" y="331">动作、写入与理由</text>
  <path class="line" d="M660 296 H700"/>

  <rect class="reason" x="700" y="244" width="210" height="104" rx="13"/>
  <text class="label" x="805" y="275">进度与世界图更新</text>
  <text class="sub" x="805" y="304">应用结构化写入</text>
  <text class="small" x="805" y="331">融合当前几何证据</text>
  <text class="edge" x="805" y="220">先更新，再分支</text>
  <path class="line" d="M910 296 H950"/>

  <path d="M1000 246 L1050 296 L1000 346 L950 296 Z" fill="#faf4e8" stroke="#bba275" stroke-width="1.6"/>
  <text class="label" x="1000" y="303">动作</text>

  <path class="line" d="M1000 246 V128 H1110"/>
  <text class="edge" x="1053" y="115">Stop</text>
  <rect x="1110" y="98" width="240" height="60" rx="30" fill="#f4f3ee" stroke="#c8c4b5" stroke-width="1.6"/>
  <text class="label" x="1230" y="136">结束 episode</text>

  <path class="line" d="M1050 296 H1110"/>
  <rect x="1110" y="202" width="300" height="158" rx="13" fill="#fcf1eb" stroke="#d1ad95" stroke-width="1.6"/>
  <text class="label" x="1260" y="232">Backtrack · 回溯</text>
  <text class="sub" x="1260" y="263">取返回目标之后的轨迹后缀</text>
  <text class="small" x="1260" y="288">映射地点，排除返回目标地点</text>
  <text class="sub" x="1260" y="315">写入这些地点的失败理由</text>
  <text class="sub" x="1260" y="343">控制器返回已存 waypoint 锚点</text>

  <path class="line" d="M1000 346 V459 H1110"/>
  <rect x="1110" y="402" width="300" height="114" rx="13" fill="#eff4fb" stroke="#a5b8d2" stroke-width="1.6"/>
  <text class="label" x="1260" y="433">前进 · 目标定位与执行</text>
  <text class="sub" x="1260" y="464">System 1 将目标定位到图像</text>
  <text class="sub" x="1260" y="494">几何投影 → FMM 控制器移动</text>

  <path class="join" d="M1410 281 H1424 V600"/>
  <path class="join" d="M1410 459 H1424"/>
  <path class="line" d="M1424 600 H780 V584"/>
  <text class="small" x="1140" y="586">回溯与前进均更新工作窗口</text>

  <rect class="box" x="620" y="510" width="320" height="74" rx="13"/>
  <text class="label" x="780" y="540">更新工作记忆窗口</text>
  <text class="sub" x="780" y="567">纳入本步观察，按 K 保留近期帧</text>
  <path class="line return" d="M620 547 H320 V368"/>
  <text class="edge" x="468" y="533">下一个决策 waypoint</text>
  <text class="small" x="720" y="630">Stop 直接终止，不经过执行和工作窗口更新。</text>
</svg>
